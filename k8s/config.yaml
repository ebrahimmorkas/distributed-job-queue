apiVersion: v1
kind: ConfigMap
metadata:
  name: job-queue-config
  namespace: job-queue
data:
  DB_URL: jdbc:postgresql://postgres:5432/jobs_db
  WORKER_CONCURRENCY: "50"
---
# Example only. In a real cluster, source this from a secret manager (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: job-queue-db
  namespace: job-queue
type: Opaque
stringData:
  DB_USERNAME: postgres
  DB_PASSWORD: change-me
