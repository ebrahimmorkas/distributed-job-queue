server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: distributed-job-queue
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobs_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

app:
  jobs:
    default-max-attempts: 5
  worker:
    enabled: ${WORKER_ENABLED:true}
    concurrency: ${WORKER_CONCURRENCY:50}
    poll-interval: 500ms
    lease: 5m
    retry-base-delay: 10s
    shutdown-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
